<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Memoria7 Dark Souls II Overlay</title>
<style>
  :root{
    --purple:#7c3aed;
    --purple2:#a855f7;
    --purple3:#c084fc;
    --ink:#09070c;
    --panel:rgba(12,8,16,.78);
    --line:rgba(192,132,252,.42);
    --text:#eee8f7;
    --muted:#a99bb7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,Arial,sans-serif;color:var(--text)}
  #overlay{position:relative;width:1920px;height:1080px;background:transparent;pointer-events:none;overflow:hidden}

  /* Ambient particles */
  #particles{position:absolute;inset:0;overflow:hidden}
  .particle{position:absolute;bottom:-20px;width:4px;height:4px;border-radius:50%;background:var(--purple2);opacity:.55;filter:blur(.2px);animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.7}100%{transform:translateY(-560px) translateX(70px) scale(.05);opacity:0}}

  /* Webcam cluster */
  .cam-wrap{position:absolute;right:56px;top:52px;width:430px}
  .brand-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;opacity:.92}
  .logo-slot{width:48px;height:48px;border:1px solid var(--line);background:rgba(8,5,12,.58);display:flex;align-items:center;justify-content:center;clip-path:polygon(10% 0,90% 0,100% 10%,100% 90%,90% 100%,10% 100%,0 90%,0 10%);box-shadow:0 0 20px rgba(124,58,237,.12)}
  .logo-slot span{font-size:10px;letter-spacing:1px;color:var(--muted)}
  .brand-text{line-height:1}
  .brand-text small{display:block;color:#8f7d9d;letter-spacing:2px;font-size:11px;margin-bottom:4px}
  .brand-text strong{font-size:24px;letter-spacing:2px;font-weight:600}

  .cam-frame{position:relative;width:430px;height:242px;border:2px solid rgba(168,85,247,.55);background:rgba(5,4,7,.08);box-shadow:0 0 28px rgba(124,58,237,.16),inset 0 0 28px rgba(124,58,237,.06);clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px)}
  .cam-frame::before,.cam-frame::after{content:"";position:absolute;inset:10px;border:1px solid rgba(192,132,252,.16);pointer-events:none}
  .cam-frame::after{inset:18px;border-color:rgba(192,132,252,.07)}
  .cam-glow{position:absolute;inset:-12px;opacity:.65;filter:blur(16px);background:radial-gradient(circle at 50% 100%,rgba(168,85,247,.28),transparent 55%);transition:.35s}
  .cam-label{position:absolute;left:18px;bottom:-17px;background:rgba(10,7,14,.92);border:1px solid rgba(168,85,247,.48);padding:7px 14px;font-size:13px;letter-spacing:1.6px;color:#dec9ef}
  .cam-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(220,200,235,.24);font-size:12px;letter-spacing:3px}

  .info-stack{margin-top:28px;display:grid;gap:8px}
  .panel{position:relative;background:var(--panel);border:1px solid rgba(168,85,247,.30);padding:12px 14px;backdrop-filter:blur(3px);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .panel::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:linear-gradient(var(--purple3),transparent);opacity:.65}
  .eyebrow{font-size:10px;letter-spacing:2px;color:#9c86ad}
  .event-name{font-size:15px;margin-top:4px;color:#f3eaf8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .souls{font-variant-numeric:tabular-nums;color:#dbc5eb}
  .bar{height:6px;background:rgba(65,38,78,.75);margin-top:8px;overflow:hidden;border-radius:99px}
  .bar>span{display:block;height:100%;width:62%;background:linear-gradient(90deg,var(--purple),var(--purple3));box-shadow:0 0 14px rgba(168,85,247,.5);transition:width .6s ease}

  /* Bonfire-ish core */
  .bonfire{position:absolute;right:392px;top:252px;width:110px;height:110px;opacity:.82;filter:drop-shadow(0 0 16px rgba(168,85,247,.35));transform-origin:50% 80%}
  .bonfire .blade{position:absolute;left:51px;bottom:22px;width:7px;height:64px;background:linear-gradient(#a7a0aa,#463a49);transform:rotate(9deg);border-radius:3px}
  .bonfire .coal{position:absolute;left:31px;bottom:10px;width:56px;height:18px;background:radial-gradient(circle,#5f3474 0 25%,#1b111f 65%,transparent 66%);filter:blur(.2px)}
  .flame{position:absolute;bottom:24px;left:32px;width:48px;height:68px;background:radial-gradient(ellipse at 50% 80%,rgba(255,255,255,.7) 0 4%,#d8b4fe 9%,#a855f7 30%,rgba(124,58,237,.55) 55%,transparent 72%);clip-path:polygon(50% 0,62% 22%,77% 36%,70% 58%,88% 74%,62% 100%,38% 100%,12% 76%,30% 56%,24% 40%);animation:flicker 1.35s ease-in-out infinite alternate}
  @keyframes flicker{0%{transform:scale(.94,.88) rotate(-1deg);filter:brightness(.9)}100%{transform:scale(1.05,1.1) rotate(1deg);filter:brightness(1.25)}}

  /* Alert */
  #alert{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:.35s;filter:drop-shadow(0 0 20px rgba(124,58,237,.38))}
  #alert.show{opacity:1;transform:translate(-50%,-50%) scale(1.02)}
  #alert .main{font-size:34px;letter-spacing:5px;color:#e9d5ff;text-shadow:0 0 18px rgba(168,85,247,.8);font-weight:600}
  #alert .sub{margin-top:8px;font-size:16px;letter-spacing:2px;color:#c7b5d5}
  #alert .rule{width:260px;height:1px;background:linear-gradient(90deg,transparent,var(--purple3),transparent);margin:12px auto 0}

  /* Bottom brand line */
  .bottom-brand{position:absolute;left:48px;bottom:38px;display:flex;align-items:center;gap:12px;color:#9f8bab;letter-spacing:2px;font-size:11px;opacity:.8}
  .bottom-brand b{color:#dfc8ee;font-size:15px;font-weight:500}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--purple2);box-shadow:0 0 10px rgba(168,85,247,.7)}

  /* Reactive states */
  .awaken .cam-frame{border-color:rgba(216,180,254,.95);box-shadow:0 0 40px rgba(168,85,247,.38),inset 0 0 40px rgba(124,58,237,.10)}
  .awaken .cam-glow{opacity:1;background:radial-gradient(circle at 50% 100%,rgba(192,132,252,.52),transparent 58%)}
  .awaken .bonfire{animation:bonfireBurst .55s ease-in-out 3}
  @keyframes bonfireBurst{50%{transform:scale(1.18);filter:drop-shadow(0 0 34px rgba(192,132,252,.75))}}
  .boss .cam-frame{border-color:rgba(244,114,182,.75);box-shadow:0 0 36px rgba(168,85,247,.40),0 0 70px rgba(124,58,237,.18)}
  .death #alert .main{color:#c9b8d2;text-shadow:0 0 14px rgba(88,55,105,.7)}

  /* hidden test panel for Browser Source interactive testing */
  #testPanel{position:absolute;left:24px;top:24px;background:rgba(8,6,11,.92);border:1px solid rgba(168,85,247,.28);padding:10px;display:none;pointer-events:auto}
  #testPanel button{margin:3px;padding:7px 10px;background:#160d1c;border:1px solid rgba(168,85,247,.32);color:#e9ddf0;cursor:pointer}
  #testPanel button:hover{background:#25122e}
</style>
</head>
<body>
<div id="overlay">
  <div id="particles"></div>

  <div class="cam-wrap">
    <div class="brand-row">
      <div class="logo-slot"><span>LOGO</span></div>
      <div class="brand-text"><small>CANAL</small><strong>MEMORIA7</strong></div>
    </div>

    <div class="cam-frame">
      <div class="cam-glow"></div>
      <div class="cam-hint">WEBCAM</div>
      <div class="cam-label">MEMORIA7 • BEARER OF THE CURSE</div>
    </div>

    <div class="info-stack">
      <div class="panel">
        <div class="eyebrow" id="eventTitle">ÚLTIMO SEGUIDOR</div>
        <div class="event-name" id="eventName">— aguardando uma nova alma —</div>
      </div>
      <div class="panel">
        <div class="row"><span class="eyebrow">ALMAS</span><span class="souls" id="souls">12.450</span></div>
        <div class="bar"><span id="soulBar"></span></div>
      </div>
    </div>
  </div>

  <div class="bonfire" aria-hidden="true">
    <div class="blade"></div><div class="coal"></div><div class="flame"></div>
  </div>

  <div id="alert">
    <div class="main" id="alertMain">NOVA ALMA DESCOBERTA</div>
    <div class="sub" id="alertSub">Um guerreiro chegou à fogueira</div>
    <div class="rule"></div>
  </div>

  <div class="bottom-brand"><span class="dot"></span><b>MEMORIA7</b><span>DARK SOULS II • LIVE</span></div>

  <div id="testPanel">
    <button data-event="follow">Follow</button>
    <button data-event="sub">Sub</button>
    <button data-event="donate">Donate</button>
    <button data-event="boss">Boss</button>
    <button data-event="death">Você Morreu</button>
  </div>
</div>

<script>
(() => {
  const overlay = document.getElementById('overlay');
  const eventTitle = document.getElementById('eventTitle');
  const eventName = document.getElementById('eventName');
  const soulsEl = document.getElementById('souls');
  const soulBar = document.getElementById('soulBar');
  const alertBox = document.getElementById('alert');
  const alertMain = document.getElementById('alertMain');
  const alertSub = document.getElementById('alertSub');
  const testPanel = document.getElementById('testPanel');
  let souls = 12450;
  let alertTimer;

  // ambient particles concentrated near webcam
  const particles = document.getElementById('particles');
  for (let i=0;i<34;i++) {
    const p = document.createElement('i');
    p.className='particle';
    p.style.left = (74 + Math.random()*24) + '%';
    p.style.animationDuration = (4 + Math.random()*7) + 's';
    p.style.animationDelay = (-Math.random()*9) + 's';
    p.style.opacity = (0.18 + Math.random()*0.52).toFixed(2);
    p.style.width = p.style.height = (2 + Math.random()*3) + 'px';
    particles.appendChild(p);
  }

  function awaken(duration=2600){
    overlay.classList.add('awaken');
    setTimeout(()=>overlay.classList.remove('awaken'),duration);
  }

  function showAlert(main, sub, duration=2800){
    clearTimeout(alertTimer);
    alertMain.textContent=main;
    alertSub.textContent=sub;
    alertBox.classList.add('show');
    alertTimer=setTimeout(()=>alertBox.classList.remove('show'),duration);
  }

  function addSouls(amount){
    souls += amount;
    soulsEl.textContent = souls.toLocaleString('pt-BR');
    const pct = Math.max(12, Math.min(100, 48 + (souls % 5000)/80));
    soulBar.style.width = pct + '%';
  }

  function handleEvent(type, data={}){
    const name = data.name || 'Nova alma';
    if(type==='follow'){
      eventTitle.textContent='ÚLTIMO SEGUIDOR';
      eventName.textContent=name;
      addSouls(120); awaken(); showAlert('NOVA ALMA DESCOBERTA', name + ' chegou à fogueira');
    }
    if(type==='sub'){
      eventTitle.textContent='NOVO SUB';
      eventName.textContent=name;
      addSouls(300); awaken(3200); showAlert('ALMA FORTALECIDA', name + ' tornou-se um aliado',3200);
    }
    if(type==='donate'){
      const value = data.value || 'R$ 10,00';
      eventTitle.textContent='ÚLTIMO DONATE';
      eventName.textContent=name + ' • ' + value;
      addSouls(500); awaken(3400); showAlert('OFERENDA À FOGUEIRA', name + ' enviou ' + value,3400);
    }
    if(type==='boss'){
      overlay.classList.add('boss');
      showAlert('BOSS FIGHT','A fogueira tornou-se instável...',2600);
      setTimeout(()=>overlay.classList.remove('boss'),6000);
    }
    if(type==='death'){
      overlay.classList.add('death');
      showAlert('VOCÊ MORREU','MEMORIA7 caiu em batalha',2600);
      setTimeout(()=>overlay.classList.remove('death'),3000);
    }
  }

  // External integration API: any browser-source script can call window.Memoria7Overlay.trigger(...)
  window.Memoria7Overlay = {
    trigger: handleEvent,
    follow: name => handleEvent('follow',{name}),
    sub: name => handleEvent('sub',{name}),
    donate: (name,value) => handleEvent('donate',{name,value}),
    boss: () => handleEvent('boss'),
    death: () => handleEvent('death')
  };

  // URL ?test=1 enables click buttons inside OBS interact window/browser
  const params = new URLSearchParams(location.search);
  if(params.get('test')==='1') testPanel.style.display='block';
  testPanel.addEventListener('click', e => {
    const t=e.target.closest('button'); if(!t) return;
    const type=t.dataset.event;
    if(type==='follow') handleEvent(type,{name:'Guerreiro_92'});
    if(type==='sub') handleEvent(type,{name:'KnightOfDrangleic'});
    if(type==='donate') handleEvent(type,{name:'PraiseTheSun',value:'R$ 10,00'});
    if(type==='boss'||type==='death') handleEvent(type);
  });
})();
</script>
</body>
</html>
